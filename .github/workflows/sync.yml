name: Institutional Terminal Sync (Neon)

on:
  schedule:
    # Run every 12 hours (00:00 and 12:00 UTC)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas nltk psycopg2-binary
          python -m nltk.downloader vader_lexicon

      - name: Sync Production Database (Neon)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "📡 Syncing production terminal intelligence to Neon..."
          python scripts/master_sync.py
          echo "🚀 Pipeline execution finished. All systems green."
